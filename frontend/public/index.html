<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Es gibt nur noch EINEN Monitor, und er laeuft auf dem Pi 5. Frueher
      // stand hier eine Ableitung aus dem Hostnamen — die ergab ueber die
      // Domain "Monitor 3", waehrend die Seite Pi-5-Werte anzeigte. Was fuer
      // Hardware das ist, sagt jetzt das Board selbst (/api/system/info);
      // der Fenstertitel braucht diese Unterscheidung gar nicht.
      (function () {
        var v = "20260731m";
        var base = "%PUBLIC_URL%";
        document.title = "Raspi Monitor";
        document.write(
          '' +
          '' +
          '' +
          '' +
          '' +
          '' +
          '' +
          ''
        );
      })();
    </script>

    <meta name="description" content="Echtzeit System-Monitoring für Raspberry Pi — CPU, Memory, Temperature, Network.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="application-name" content="Raspi Monitor">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0E1116">
    <meta name="color-scheme" content="dark">
    <meta name="msapplication-TileColor" content="#0E1116">

    <!-- Fallback, falls das Script blockiert wird -->
<link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <script>
      // Home-Screen-Name gleichziehen (ein Monitor, ein Name).
      document.addEventListener("DOMContentLoaded", function () {
        var t = "Raspi Monitor";
        var m = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (!m) {
          m = document.createElement("meta");
          m.name = "apple-mobile-web-app-title";
          document.head.appendChild(m);
        }
        m.content = t;
        var a = document.querySelector('meta[name="application-name"]');
        if (a) a.content = t;
      });
    </script>
    <!-- Die geteilten Dateien liegen als Kopie in public/shared/ und werden von
         `npm run sync:shared` (prebuild) aus dem Dashboard-Repo aufgefrischt.
         Ein Verweis auf ein fremdes /shared/ ginge hier ins Leere: der Monitor
         wird direkt auf :4999 geöffnet — genau daran hing die Leiste bisher,
         sie lud nie, und deshalb war das die einzige App ohne App-Wechsler. -->
    <link rel="stylesheet" href="%PUBLIC_URL%/shared/theme.css?v=2">
    <script>(function(){try{var t=localStorage.getItem('sh-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <script src="%PUBLIC_URL%/shared/icons.js?v=8" defer></script>
    <script src="%PUBLIC_URL%/shared/nav.js?v=20" defer blocking="render"></script>
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg">
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png">
    <style>
      /* Roboto Flex liegt hier IN der App, nicht unter /shared/: der Pi-5-Monitor
         wird direkt auf :4999 geöffnet, wo es /shared/ nicht gibt. Ein Verweis
         dorthin wäre genau der Fehler, an dem hier schon die Favicons hingen. */
      @font-face{
        font-family:'Roboto Flex';
        src:url('%PUBLIC_URL%/RobotoFlex.woff2') format('woff2-variations');
        font-weight:100 1000; font-stretch:25% 151%; font-display:swap;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
