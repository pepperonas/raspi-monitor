<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Pi5 = .105; everything else (Pi3 direct, nginx /app/monitor/, home.celox.io) = Monitor 3
      (function () {
        var n = location.hostname === "192.168.178.105" ? "5" : "3";
        window.__MON_N = n;
        var v = "20260731m";
        var base = "%PUBLIC_URL%";
        document.title = "Monitor " + n + " · Raspberry Pi";
        document.write(
          '' +
          '' +
          '' +
          '' +
          '' +
          '' +
          '' +
          ''
        );
      })();
    </script>

    <meta name="description" content="Echtzeit System-Monitoring für Raspberry Pi — CPU, Memory, Temperature, Network.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="application-name" content="Raspi Monitor">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0E1116">
    <meta name="color-scheme" content="dark">
    <meta name="msapplication-TileColor" content="#0E1116">

    <!-- Fallbacks if script blocked (Monitor 3 defaults) -->
<link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <script>
      // Sync apple title + manifest name to Monitor 3/5 after parse
      document.addEventListener("DOMContentLoaded", function () {
        var n = window.__MON_N || "3";
        var t = "Monitor " + n;
        var m = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (!m) {
          m = document.createElement("meta");
          m.name = "apple-mobile-web-app-title";
          document.head.appendChild(m);
        }
        m.content = t;
        var a = document.querySelector('meta[name="application-name"]');
        if (a) a.content = t;
      });
    </script>
    <script src="/shared/nav.js" defer></script>
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg">
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png">
    <style>
      /* Roboto Flex liegt hier IN der App, nicht unter /shared/: der Pi-5-Monitor
         wird direkt auf :4999 geöffnet, wo es /shared/ nicht gibt. Ein Verweis
         dorthin wäre genau der Fehler, an dem hier schon die Favicons hingen. */
      @font-face{
        font-family:'Roboto Flex';
        src:url('%PUBLIC_URL%/RobotoFlex.woff2') format('woff2-variations');
        font-weight:100 1000; font-stretch:25% 151%; font-display:swap;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
